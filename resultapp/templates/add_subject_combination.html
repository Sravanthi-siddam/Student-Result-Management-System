{% extends 'admin_base.html' %}

{% block content %}
<div class="" container>
    <h2 class="mb-4"><i class="fas fa-plus"></i> Manage Subject combination</h2>
    {% if messages %}
    {% for m in messages %}
    <div class="alert alert-{% if m.tags == 'error' %}danger{% else %}{{m.tags}}{% endif %} alert-dismissible fade show"
        role="alert">
        {{m}}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>

    </div>


    {% endfor %}

    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="class" class="form-label">Subject Class</label>
            <select class="form-select" id="branch" name="branch" required>
                <option value="">--- Select Branch ---</option>
                {% for i in branches %}
                <option value="{{i.id}}">{{i.branch_name}} - section {{i.section}}</option>

                {% endfor %}
            </select>

        </div>
        <div class="mb-3">
            <label for="subject" class="form-label">Select Subject</label>

            <select class="form-select" id="subject" name="subject" required>
                <option value="">--- Select Subject ---</option>

                {% for i in subjects %}
                <option value="{{ i.id }}">
                    {{ i.subject_name }} - {{ i.subject_id }}
                </option>
                {% endfor %}

            </select>
        </div>
        </select>

</div>
<button type="submit" class="btn btn-success">Submit</button>
</form>
</div>

{% endblock %}
