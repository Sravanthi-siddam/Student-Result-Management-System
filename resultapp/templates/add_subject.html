{% extends 'admin_base.html' %}

{% block content %}
<div class=""container>
    <h2 class="mb-4"><i class="fas fa-book"></i> Add Subject</h2>
    {% if messages %}
        {% for m in messages %}
            <div class="alert alert-{% if m.tags == 'error' %}danger{% else %}{{m.tags}}{% endif %} alert-dismissible fade show" role="alert">
                {{m}}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>

            </div>

        {% endfor %}

    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="subjectname" class="form-label">Name of the Subject</label> 
            <input type="text" class="form-control" id="subjectname" name="subjectname" reuired placeholder="e.g.,DBMS,SE,ML">

        </div>
        <div class="mb-3">
            <label for="subjectcode" class="form-label">Subject Code</label> 
            <input type="text" class="form-control" id="subjectcode" name="subjectcode" reuired placeholder="1467,1340">

        </div>
        <button type="submit" class="btn btn-success">Submit</button>
    </form>
</div>

{% endblock %}
