{% extends 'admin_base.html' %}

{% block content %}
<div class=""container>
    <h2 class="mb-4"><i class="fas fa-key"></i> Change Password</h2>
    {% if messages %}
        {% for m in messages %}
            <div class="alert alert-{% if m.tags == 'error' %}danger{% else %}{{m.tags}}{% endif %} alert-dismissible fade show" role="alert">
                {{m}}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>

            </div>


        {% endfor %}

    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="old" class="form-label">Current Password</label> 
            <input type="password" class="form-control" id="old_password" name="old_password" reuired placeholder="Enter current password">

        </div>
        <div class="mb-3">
            <label for="new" class="form-label">New Password</label> 
            <input type="password" rows="5" id="new" name="new" reuired placeholder="Enter New Password">

        </div>

        <div class="mb-3">
            <label for="Confirm" class="form-label">Confirm New Password</label> 
            <input type="password" rows="5" id="Confirm" name="Confirm" reuired placeholder="Confirm New Password">

        </div>

        

        <button type="submit" class="btn btn-success">Submit</button>
    </form>
</div>

{% endblock %}8
