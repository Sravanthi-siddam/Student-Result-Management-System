{% extends 'admin_base.html' %}

{% block content %}
<div class=""container>
    <h2 class="mb-4"><i class="fas fa-user-plus"></i> Add Student</h2>
    {% if messages %}
        {% for m in messages %}
            <div class="alert alert-{% if m.tags == 'error' %}danger{% else %}{{m.tags}}{% endif %} alert-dismissible fade show" role="alert">
                {{m}}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>

            </div>


        {% endfor %}

    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="fullname" class="form-label">Full Name</label> 
            <input type="text" class="form-control" id="fullname" name="fullname" reuired placeholder="Enter full name">

        </div>
        <div class="mb-3">
            <label for="regid" class="form-label">Reg No</label> 
            <input type="text" class="form-control" id="regid" name="regid" reuired placeholder="Enter reg No" maxlength="10">

        </div>

        <div class="mb-3">
            <label for="emailid" class="form-label">Email ID</label> 
            <input type="email" class="form-control" id="emailid" name="emailid" reuired placeholder="Enter Mail ID" maxlength="50">
        </div>

        <div class="mb-3">
            <label for="gender" class="form-label">Gender</label><br/>
            <div class="form-check form-check-inline">
            <input type="radio" class="form-check-input" id="gender" name="gender" required value="Male">
            <label class="form-check-label">Male</label>
            </div>
            <input type="radio" class="form-check-input" id="gender" name="gender" reuired value="Female">
            <label class="form-check-label">Female</label>
            </div>
        </div>

        <div class="mb-3">
            <label for="branch" class="form-label">Subject Branch</label>
            <select class="form-select" id="branch" name="branch" required>
                <option value="">--- Select Branch ---</option>
                {% for i in branches %}
                <option value="{{i.id}}">{{i.branch_name}} - section {{i.section}}</option>

                {% endfor %}
            </select>

        </div>

        <div class="mb-3">
            <label for="dob" class="form-label">Date of Birth</label> 
            <input type="date" class="form-control" id="dob" name="dob" reuired placeholder="Enter Mail ID" maxlength="10">
        </div>


        <button type="submit" class="btn btn-success">Submit</button>
    </form>
</div>

{% endblock %}
