{% extends 'admin_base.html' %}

{% block content %}
<div class=""container>
    <h2 class="mb-4"><i class="fas fa-edit"></i> Edit Student info</h2>
    {% if messages %}
        {% for m in messages %}
            <div class="alert alert-{% if m.tags == 'error' %}danger{% else %}{{m.tags}}{% endif %} alert-dismissible fade show" role="alert">
                {{m}}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>

            </div>

        {% endfor %}

    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="fullname" class="form-label">Full Name</label> 
            <input type="text" class="form-control" id="fullname" name="fullname" reuired placeholder="Enter full name" value="{{student_obj.name}}">

        </div>
        <div class="mb-3">
            <label for="regid" class="form-label">Reg No</label> 
            <input type="text" class="form-control" id="regid" name="regid" reuired placeholder="Enter reg No" maxlength="10" value="{{student_obj.reg_id}}">

        </div>

        <div class="mb-3">
            <label for="emailid" class="form-label">Email ID</label> 
            <input type="text" class="form-control" id="emailid" name="emailid" reuired placeholder="Enter Mail ID" maxlength="10" value="{{student_obj.email_id}}">
        </div>

        <div class="mb-3">
            <label for="gender" class="form-label">Gender</label><br/>
            <div class="form-check form-check-inline">
            <input type="radio" class="form-check-input" id="gender" name="gender" required value="Male" {% if student_obj.gender=="Male" %}checked{% endif %}>
            <label class="form-check-label">Male</label>
            </div>
            <input type="radio" class="form-check-input" id="gender" name="gender" reuired value="Female" {% if student_obj.gender=="Female" %}checked{% endif %}>
            <label class="form-check-label">Female</label>
            </div>
        </div>

        <div class="mb-3">
            <label for="class" class="form-label">Select Class</label>
            <input type="text" class="form-control" id="class" name="class" value="{{student_obj.student_branch.class_name}} {{student_obj.student_branch.section}}" readonly>

        </div>

        <div class="mb-3">
            <label for="dob" class="form-label">Date of Birth</label> 
            <input type="date" class="form-control" id="dob" name="dob" reuired value="{{student_obj.dob}}">
        </div>

        <div class="mb-3">
            <label for="regdate" class="form-label">Reg Date</label> 
            <input type="date" class="form-control" id="regdate" name="regdate" value="{{student_obj.dob}}" readonly>
        </div>

        <div class="mb-3">
            <label for="gender" class="form-label">Status</label><br/>
            <div class="form-check form-check-inline">
            <input type="radio" class="form-check-input" id="status" name="status" required value=1 {% if student_obj.gender==1 %}checked{% endif %}>
            <label class="form-check-label">Active</label>
            </div>
            <input type="radio" class="form-check-input" id="status" name="status" reuired value=0 {% if student_obj.gender==0 %}checked{% endif %}>
            <label class="form-check-label">Inactive</label>
            </div>
        </div>


        <button type="submit" class="btn btn-success">Submit</button>
    </form>
</div>

{% endblock %}
