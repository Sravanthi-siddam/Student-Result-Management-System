{% extends 'base.html' %}

{% block content %}


    <header class="py-5 bg-dark text-white">
        <div class="container text-center">
            <h1 class="display-4 fw-bold">Welcome to Student Result Management System</h1>
            <p>Manage and view results efficiently</p>

        </div>


    </header>

    <section class="pt-5">
        <div class="container">
            <h2 class="text-center mb-4"><i class="fas fa-bullhorn text-primary"></i>Notice Board</h2>
            <div class="border p-3 rounded bg-light">
            <marquee behavior="" direction="up" scrollamount="2" onmouseover="this.stop()" onmouseout="this.start()">
            <ul class="list-unstyled">
                {% for n in notices %}
                <li>
                    <a href="{% url 'notice_detail' n.id %}" target="_blank"><i class="fas fa-angle-right text-primary"></i>{{n.title}}</a>
                </li>
                
                {% endfor %}
            </ul>
            </marquee>
            </div>


        </div>


    </section>

    {% endblock %}
