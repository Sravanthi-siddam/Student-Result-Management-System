{% extends 'admin_base.html' %}

{% block content %}

<div class="container">

    <h2 class="mb-4">
        <i class="fas fa-plus"></i>
        Declare Result
    </h2>
    {% if messages %}
    {% for m in messages %}
    <div class="alert alert-{% if m.tags == 'error' %}danger{% else %}{{ m.tags }}{% endif %} alert-dismissible fade show"
        role="alert">
        {{ m }}
        <button type="button" class="btn-close" data-bs-dismiss="alert">
        </button>
    </div>
    {% endfor %}
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">

            <label for="branch_id" class="form-label">
                Select Branch </label>

            <select class="form-select" id="branch_id" name="branch" required>

                <option value="">
                    --- Select Branch ---
                </option>

                {% for i in branches %}

                <option value="{{ i.id }}">
                    {{ i.branch_name }} - Section {{ i.section }}
                </option>

                {% endfor %}

            </select>

        </div>

        <div class="mb-3">

            <label for="student_id" class="form-label">
                Select Student
            </label>

            <select class="form-select" id="student_id" name="student_id" required>

                <option value="">
                    --- Select Student --- </option>
            </select>

        </div>

        <div id="subject_fields">

        </div>

        <button type="submit" class="btn btn-success">

            <i class="fas fa-save"></i>
            Submit

        </button>

    </form>

</div>


<script>
    document.getElementById('branch_id').addEventListener('change', function () {

        const branchId = this.value;

        console.log("Selected Branch:", branchId);

        if (!branchId) {
            return;
        }
        fetch(`/get_student_subjects/?branch_id=${branchId}`)
            .then(response => {
                console.log("Response status:", response.status);
                return response.json();
            })
            .then(data => {
                console.log("Data received:", data);
                const studentSelect =
                    document.getElementById('student_id');
                studentSelect.innerHTML =
                    '<option value="">--- Select Student ---</option>';

                data.students.forEach(function (student) {
                     const option = document.createElement('option');
                    option.value = student.id;
                    option.text =
                        student.name +
                        " (Reg ID: " +
                        student.reg_id +
                        ")";

                    studentSelect.appendChild(option);
                });

                const subjectFields =
                    document.getElementById('subject_fields');

                subjectFields.innerHTML = '<h5 class="mt-5">Subjects and Marks</h5>';

                data.subjects.forEach(function (subject) {
                    subjectFields.innerHTML += `
                    <div class="mb-3">
                        <label class="form-label">
                            ${subject.name} (${subject.code})
                        </label>

                        <input
                            type="number"name="marks_${subject.id}" class="form-control" min="0" max="100" required>
                    </div>
                `;
                });
            })
            .catch(error => {
                console.error("ERROR:", error);
            });
    });
</script>

{% endblock %}
